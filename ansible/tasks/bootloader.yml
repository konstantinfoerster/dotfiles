---
- name: Configure bootloader grub
  when: bootloader == 'grub'
  block:
    - name: Install grub package
      community.general.pacman:
        name:
          - grub
        state: present

    - name: Install grub
      ansible.builtin.command: "grub-install --target=i386-pc {{ main_disk }}"
      changed_when: true

    - name: Generate grub config
      ansible.builtin.command: "grub-mkconfig -o /boot/grub/grub.cfg"
      changed_when: true

- name: Configure bootloader systemd-boot
  when: bootloader == 'systemd-boot'
  block:
    - name: Read root filesystem UUID
      ansible.builtin.command: findmnt -no UUID /
      register: root_uuid
      changed_when: false
      failed_when: root_uuid.rc != 0 or root_uuid.stdout == ''

    - name: Write loader.conf
      ansible.builtin.copy:
        dest: /boot/loader/loader.conf
        content: |
          default arch.conf
          timeout 3
          console-mode max
          editor no
        mode: "0644"

    - name: Write arch boot entry
      ansible.builtin.copy:
        dest: /boot/loader/entries/arch.conf
        content: |
          title   Arch Linux
          linux   /vmlinuz-linux
          initrd  /initramfs-linux.img
          options root=UUID={{ root_uuid.stdout }} rw
        mode: "0644"

    - name: Verify systemd-boot configuration
      ansible.builtin.command: bootctl
      changed_when: false
