---
- name: Enable multilib repository
  ansible.builtin.replace:
    path: /etc/pacman.conf
    regexp: '^#\[multilib]\n#(Include.*)'
    replace: '[multilib]\n\1'
    group: root
    owner: root
    mode: '0644'
  when: gaming | default(false)

- name: Add pacman mirror
  ansible.builtin.replace:
    path: /etc/pacman.conf
    regexp: '^(\[extra]|\[core]|\[multilib])\n(Include.*)'
    replace: '\1\nServer = {{ pacman_mirror }}\n\2'
    group: root
    owner: root
    mode: '0644'
