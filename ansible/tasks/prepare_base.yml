---
- name: Prepare mounted base system
  tags:
    - prepare
    - never
  block:
    - name: Install based packages into chroot
      ansible.builtin.command:
        cmd: pacstrap /mnt base linux linux-firmware gvim ansible git sudo
        creates: /mnt/etc/arch-release

    - name: Generate filesystem mount configuration
      ansible.builtin.shell: genfstab -U /mnt > /mnt/etc/fstab
      changed_when: true

    - name: Create user home
      ansible.builtin.file:
        path: "/mnt/home/{{ user }}"
        state: directory
        mode: "0700"

    - name: Copy dotfiles into new system
      ansible.builtin.command:
        cmd: "cp -a {{ playbook_dir | dirname }} /mnt{{ dotfiles_dir }}"
        creates: "/mnt{{ dotfiles_dir }}"

    - name: Install systemd-boot with UEFI boot entry
      ansible.builtin.command: arch-chroot -S /mnt bootctl install
      args:
        creates: /mnt/boot/EFI/systemd/systemd-bootx64.efi
      when: bootloader == 'systemd-boot'
