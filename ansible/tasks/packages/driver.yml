---
- name: Install driver packages
  community.general.pacman:
    name:
      - ntfs-3g
      - exfatprogs
      - mesa
      - libva-utils
    state: present

- name: Install intel video driver packages
  community.general.pacman:
    name:
      - libva-intel-driver
    state: present
  when: "'GenuineIntel' in ansible_facts['processor']"
