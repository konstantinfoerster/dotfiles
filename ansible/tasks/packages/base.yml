---
- name: Install base system packages
  community.general.pacman:
    name:
      - networkmanager
      - base-devel
      - bash-completion
      - openssh
      - gnupg
      - git
      - man-db
      - pwgen
      - traceroute
      - dosfstools
      - man-pages
    state: present

- name: Gather CPU facts
  ansible.builtin.setup:
    gather_subset:
      - hardware
    filter:
      - ansible_processor

- name: Install CPU microcode
  community.general.pacman:
    name: "{{ ucode_packages[cpu_vendor] }}"
    state: present
  vars:
    ucode_packages:
      GenuineIntel: intel-ucode
      AuthenticAMD: amd-ucode
    cpu_vendor: "{{ ansible_facts['processor'][1] }}"
  when: cpu_vendor in ucode_packages
  register: ucode

- name: Regenerate initramfs with microcode
  ansible.builtin.command: mkinitcpio -P
  changed_when: true
  when: ucode.changed # noqa no-handler

- name: Enable periodic TRIM
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: true

- name: Enable NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    enabled: true
    state: started

- name: Harden ssh daemon
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-harden.conf
    content: |
      PasswordAuthentication no
      PermitEmptyPasswords no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      GSSAPIAuthentication no
      X11Forwarding no
    mode: "0644"
  register: sshd_config

- name: Enable ssh daemon
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: "{{ 'restarted' if sshd_config.changed else 'started' }}"
