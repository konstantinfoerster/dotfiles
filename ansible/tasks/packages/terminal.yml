---
- name: Install terminal packages
  community.general.pacman:
    name:
      - alacritty
      - htop
      - tmux
      - gvim # vim with +clipboard support
      - jq
      - mediainfo # technical and tag information about a video or audio file
      - ripgrep # nvim telescope
      - fzf # command-line fuzzy finder
      - tree-sitter-cli
      # nvim
      - neovim
      - fd # telescope alternative to find
      - luacheck # lua linter
      # password manager
      - pass
      - wl-clipboard
    state: present
