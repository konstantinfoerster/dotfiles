---
- name: "Read device information from {{ main_disk }}"
  community.general.parted:
    device: "{{ main_disk }}"
    unit: "MiB"
  register: main_disk_info
  tags:
    - never
    - wipe
    - storage

- name: Ensure /mnt/boot is not mounted
  ansible.posix.mount:
    path: /mnt/boot
    state: unmounted
  tags:
    - never
    - wipe
    - storage

- name: Ensure /mnt is not mounted
  ansible.posix.mount:
    path: /mnt
    state: unmounted
  tags:
    - never
    - wipe
    - storage

- name: Format existing {{ main_disk }}
  tags:
    - never
    - wipe
  block:
    - name: Close LUKS device
      community.crypto.luks_device:
        name: "{{ crypted_disk_name }}"
        state: closed

    - name: Wipe filesystem and LUKS signatures from all partitions
      ansible.builtin.shell: "wipefs --all {{ main_disk }}?*"
      changed_when: true
      when: main_disk_info.partitions | length > 0

    - name: Remove all partitions from disk
      community.general.parted:
        device: "{{ main_disk }}"
        number: "{{ item.num }}"
        state: absent
      loop: "{{ main_disk_info.partitions }}"

- name: Create, format and mount partitions
  tags:
    - never
    - storage
  vars:
    root_device: "{{ '/dev/mapper/' ~ crypted_disk_name if crypted_disk else main_disk_partition_root }}"
  block:
    - name: Create boot partition
      community.general.parted:
        label: "{{ boot_partition.label }}"
        device: "{{ main_disk }}"
        number: 1
        part_end: 2048MB
        flags: "{{ boot_partition.flags }}"
        state: present

    - name: Format boot partition
      community.general.filesystem:
        fstype: "{{ boot_partition.fstype }}"
        opts: "{{ boot_partition.mkfs_opts | default(omit) }}"
        dev: "{{ main_disk_partition_boot }}"
        state: present

    - name: Create root partition
      community.general.parted:
        label: "{{ boot_partition.label }}"
        device: "{{ main_disk }}"
        number: 2
        part_start: 2048MB
        part_end: 100%
        state: present

    - name: Encrypt root partition
      community.crypto.luks_device:
        device: "{{ main_disk_partition_root }}"
        type: luks2
        hash: "sha512"
        name: "{{ crypted_disk_name }}"
        keysize: 512
        passphrase: "{{ main_disk_password }}"
        state: "opened"
      when: crypted_disk

    - name: Format root partition
      community.general.filesystem:
        fstype: ext4
        dev: "{{ root_device }}"
        state: present

    - name: Mount root partition
      ansible.posix.mount:
        fstype: ext4
        src: "{{ root_device }}"
        path: /mnt
        state: mounted

    - name: Mount boot partition
      ansible.posix.mount:
        fstype: "{{ boot_partition.fstype }}"
        src: "{{ main_disk_partition_boot }}"
        path: /mnt/boot
        state: mounted
