---
- name: "Check existing {{ file }}"
  ansible.builtin.stat:
    path: "/home/{{ user }}/{{ file }}"
  register: file_available

- name: "Remove existing none link {{ file }}"
  ansible.builtin.file:
    path: "/home/{{ user }}/{{ file }}"
    state: absent
  when: file_available.stat.exists and not file_available.stat.islnk

- name: Make sure destination dir exists
  ansible.builtin.file:
    path: "{{ '/home/' + user + '/' + file | dirname }}"
    mode: "0700"
    owner: "{{ user }}"
    group: "{{ user }}"
    state: directory
  when: not file_available.stat.exists and file | dirname | length > 0

- name: "Link file {{ file }}"
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/{{ file }}"
    dest: "/home/{{ user }}/{{ file }}"
    owner: "{{ user }}"
    group: "{{ user }}"
    state: link
