---
- name: "Ensure system is setup"
  hosts: localhost
  become: true
  gather_facts: false
  vars_files:
    - config.yml
    - vars/bootloader.yml

  pre_tasks:
    - name: Run pre tasks
      tags:
        - always
      block:
        - name: Running from iso?
          ansible.builtin.command: uname -a
          changed_when: false
          register: uname_out

        - name: Set hostlist based on running system
          ansible.builtin.set_fact:
            hostlist: "{{ 'chroot' if 'archiso' in uname_out.stdout else 'localhost' }}"
            is_archiso: "{{ 'archiso' in uname_out.stdout }}"

        - name: Check boot mode
          ansible.builtin.stat:
            path: /sys/firmware/efi
          register: efi

        - name: Ensure bootloader matches boot mode
          ansible.builtin.assert:
            that: efi.stat.exists == (bootloader == 'systemd-boot')
            fail_msg: "bootloader={{ bootloader }} does not match the boot mode (UEFI={{ efi.stat.exists }})"
            quiet: true

  tasks:
    - name: Setup storage
      ansible.builtin.import_tasks: tasks/storage.yml
      when: is_archiso

    - name: Prepare base system
      ansible.builtin.import_tasks: tasks/prepare_base.yml
      when: is_archiso

- name: Ensure local system is setup correctly
  ansible.builtin.import_playbook: local_system.yml
  vars:
    hostlist: "{{ hostvars['localhost']['hostlist'] }}"
  tags:
    - always
